<!-- ★【完全修復】文章と画像を同時に待って最初から画像付きで一発描画するスクリプト（Pages CMS完全連動版） -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('servicesContainer');
      const serviceTargetIds = ['corporate', 'audit', 'startup', 'finance', 'cloud', 'inheritance', 'labor'];
      const serviceKeys = ['service_01', 'service_02', 'service_03', 'service_04', 'service_05', 'service_06', 'service_07'];

      // サブディレクトリ対応パスヘルパー
      const pathParts = window.location.pathname.split('/');
      let repoBase = './';
      const repoIndex = pathParts.indexOf('terazawazeirishi');
      if (repoIndex !== -1) {
        repoBase = pathParts.slice(0, repoIndex + 1).join('/') + '/';
      }

      const resolveImgUrl = (rawPath) => {
        if (!rawPath || typeof rawPath !== 'string') return '';
        const trimmed = rawPath.trim();
        if (!trimmed) return '';
        if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) return trimmed;
        let clean = trimmed.replace(/^(\.\/|\/)/, '');
        if (clean.startsWith('terazawazeirishi/')) {
          clean = clean.replace('terazawazeirishi/', '');
        }
        return repoBase + clean;
      };

      // ★ 文章データと画像データの両方が揃うのを完全に待つ（競合の完全根絶）
      Promise.all([
        fetch('./content/services.json?v=' + Date.now()).then(r => r.ok ? r.json() : null),
        fetch('./content/site_images.json?v=' + Date.now()).then(r => r.ok ? r.json() : null)
      ])
      .then(([servicesData, imagesData]) => {
        // ★ Pages CMS の 'services' および従来の 'service_items' の両方に完全対応
        const rawItems = (servicesData && (servicesData.services || servicesData.service_items)) || [];
        if (!rawItems || rawItems.length === 0) return;

        container.innerHTML = '';
        rawItems.forEach((item, index) => {
          const isReverse = (index % 2 === 1);
          const targetId = item.id || serviceTargetIds[index] || `service-${index + 1}`;
          const key = item.image_key || serviceKeys[index];
          const serviceNo = item.service_no || (item.num ? `SERVICE ${item.num}` : `SERVICE 0${index + 1}`);
          const leadText = item.lead || item.summary || '';
          const descText = item.description || '';

          const article = document.createElement('article');
          article.id = targetId;
          article.className = `athena-zigzag-item ${isReverse ? 'is-reverse' : ''}`;
          article.style.cssText = 'border-bottom: 1px solid var(--color-border); padding-bottom: 5rem;';

          // 画像の完全特定
          let visualHtml = '';
          const rawImg = (imagesData && imagesData[key]) || item.image || '';
          const imgPath = rawImg ? resolveImgUrl(rawImg) : '';

          if (imgPath) {
            visualHtml = `<img src="${imgPath}" alt="${escapeHtml(item.title)}" class="zigzag-visual-img" style="width:100%; height:100%; object-fit:cover; display:block;">`;
          } else {
            visualHtml = `
              <svg class="zigzag-visual-img" viewBox="0 0 700 460" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="700" height="460" fill="#FAF8F5"/>
                <circle cx="350" cy="230" r="140" fill="#F4EEDC" opacity="0.6"/>
                <text x="350" y="235" font-family="'Cinzel', serif" font-size="22" fill="#1B2A4A" text-anchor="middle" font-weight="600">${escapeHtml(serviceNo)}</text>
              </svg>
            `;
          }

          // ポイント箇条書き または 詳細説明文の生成
          let detailsHtml = '';
          if (item.points) {
            const pointLines = item.points.split('\n').filter(l => l.trim());
            const pointsList = pointLines.map(p => `
              <li style="display: flex; align-items: center; gap: 8px; font-size: 0.95rem; color: var(--color-primary);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A08C4A" stroke-width="2.5" style="flex-shrink:0;"><polyline points="20 6 9 17 4 12"/></svg>
                <span>${escapeHtml(p)}</span>
              </li>
            `).join('');
            detailsHtml = `<ul style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 2rem;">${pointsList}</ul>`;
          } else if (descText) {
            detailsHtml = `<p style="color: var(--color-text-sub); line-height: 1.8; margin-bottom: 2rem; font-size: 0.95rem;">${escapeHtml(descText)}</p>`;
          }

          article.innerHTML = `
            <div class="zigzag-visual-slot">
              ${visualHtml}
            </div>
            <div class="zigzag-content">
              <span class="zigzag-tag">${escapeHtml(serviceNo)}</span>
              <h2 style="font-family: var(--font-serif); font-size: 1.8rem; color: var(--color-primary); margin-bottom: 1rem;">${escapeHtml(item.title)}</h2>
              <p style="color: var(--color-text-sub); line-height: 1.9; margin-bottom: 1.5rem;">${escapeHtml(leadText)}</p>
              ${detailsHtml}
              <a href="./pricing.html#plans" class="service-card-link">料金を見る &rarr;</a>
            </div>
          `;
          container.appendChild(article);
        });
      })
      .catch(err => {
        console.warn('Services render error:', err);
      });

      function escapeHtml(str) {
        return String(str).replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
      }
    });
  </script>
  <script src="./assets/js/main.js" defer></script>
