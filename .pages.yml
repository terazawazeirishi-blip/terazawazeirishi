  - name: editorial
    label: お知らせ・コラム
    type: group
    items:
      - name: blog-posts
        label: 税務・経営コラム記事
        type: collection
        path: blog
        filename: "{year}-{month}-{day}-{title}.md"
        exclude:
          - index.html
          - "*.html"
        format: yaml-frontmatter
        view:
          primary: title
          fields:
            - title
            - date
            - category
          sort: date
          order: desc
        fields:
          - name: title
            label: 記事タイトル
            type: string
            required: true
          - name: date
            label: 公開日
            type: date
          - name: category
            label: カテゴリー
            type: string
          - name: description
            label: 記事の要約
            type: text
          - name: thumbnail
            label: サムネイル画像
            type: image
          - name: body
            label: 記事本文
            type: rich-text

      - name: news
        label: トップページのお知らせ
        type: collection
        path: content/news
        filename: "{year}-{month}-{day}-{title}.md"
        format: yaml-frontmatter
