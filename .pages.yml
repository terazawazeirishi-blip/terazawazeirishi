# Pages CMS 設定ファイル (.pages.yml)
# APIキー不要・GitHub公式連携

media:
  input: assets/images/uploads
  output: /assets/images/uploads

content:
  # 1. 税務・経営コラム
  - name: blog
    label: 税務・経営コラム
    type: collection
    path: content/blog
    view:
      fields: [title, date, category]
      primary: title
    fields:
      - name: title
        label: 記事タイトル
        type: string
        required: true
      - name: date
        label: 公開日
        type: date
        required: true
      - name: category
        label: カテゴリー
        type: select
        options:
          - 法人税務
          - 確定申告
          - クラウド会計
          - 創業支援
          - 相続税
          - お知らせ
        required: true
      - name: description
        label: 概要（ディスクリプション）
        type: string
        required: true
      - name: body
        label: 本文
        type: rich-text
        required: true

  # 2. 事務所からのお知らせ
  - name: news
    label: 事務所からのお知らせ
    type: collection
    path: content/news
    view:
      fields: [title, date, importance]
      primary: title
    fields:
      - name: title
        label: 件名
        type: string
        required: true
      - name: date
        label: 掲載日
        type: date
        required: true
      - name: importance
        label: 重要度
        type: select
        options:
          - 通常
          - 重要
          - 夏季/冬季休業
        default: 通常
      - name: body
        label: お知らせ内容
        type: rich-text
        required: true
