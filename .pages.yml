# ==============================================================================
# 寺沢景子税理士事務所 Pages CMS 設定定義ファイル（バッジ増減・文字消去完全対応版）
# ファイルパス: .pages.yml
# ==============================================================================

media:
  input: "assets/images/uploads"
  output: "assets/images/uploads"

content:
  # ============================================================================
  # 1. サイト全画像の変更
  # ============================================================================
  - name: "site_images"
    label: "📷 サイト全画像の変更"
    type: "file"
    path: "content/site_images.json"
    fields:
      - name: "logo_img"
        label: "ロゴ画像（ヘッダー・フッター共通）"
        type: "image"
      - name: "watermark_crest"
        label: "背景透かし画像（花冠・幾何学模様）"
        type: "image"
      - name: "hero_illustration"
        label: "ヒーロー象徴イラスト（白百合・花など）"
        type: "image"
      - name: "rep_keiko"
        label: "代表税理士 寺沢景子の写真"
        type: "image"
      - name: "rep_senior"
        label: "ベテラン税理士の写真"
        type: "image"
      - name: "about_01"
        label: "About 01（2人体制ダブルチェック）の写真"
        type: "image"
      - name: "about_02"
        label: "About 02（国税21年元統括官）の写真"
        type: "image"
      - name: "about_03"
        label: "About 03（税理士歴35年実績）の写真"
        type: "image"
      - name: "about_04"
        label: "About 04（ザワテラス社労士連携）の写真"
        type: "image"
      - name: "about_05"
        label: "About 05（相談サロン風景）の写真"
        type: "image"
      - name: "service_01"
        label: "Service 01 法人税務顧問の写真"
        type: "image"
      - name: "service_02"
        label: "Service 02 税務調査対策の写真"
        type: "image"
      - name: "service_03"
        label: "Service 03 会社設立支援の写真"
        type: "image"
      - name: "service_04"
        label: "Service 04 創業融資支援の写真"
        type: "image"
      - name: "service_05"
        label: "Service 05 クラウド会計の写真"
        type: "image"
      - name: "service_06"
        label: "Service 06 相続税申告の写真"
        type: "image"
      - name: "service_07"
        label: "Service 07 助成金・労務支援の写真"
        type: "image"
      - name: "cta_banner_bg"
        label: "ページ下部 CTAバナー背景写真"
        type: "image"

  # ============================================================================
  # 2. トップページ全文章の編集（★バッジ追加・削除リスト化）
  # ============================================================================
  - name: "home_texts"
    label: "🏠 トップページ全文章の編集"
    type: "file"
    path: "content/home_texts.json"
    fields:
      - name: "hero_sub_en"
        label: "ファーストビュー上部 英語サブタイトル"
        type: "string"
      - name: "hero_title"
        label: "メインキャッチコピー（改行可）"
        type: "text"
      - name: "hero_lead"
        label: "ヒーロー説明文"
        type: "text"

      # ★【新設】月桂樹バッジの自由追加・削除リスト
      - name: "hero_badges"
        label: "月桂樹バッジ一覧（＋で追加、ゴミ箱で削除、並び替え可能）"
        type: "object"
        list:
          collapsible: true
          summary: "{text}"
        fields:
          - name: "text"
            label: "バッジの文言（例: 国税21年在職（元法人統括官））"
            type: "string"
            required: true

      - name: "hero_cta_btn"
        label: "ファーストビュー無料相談ボタンの文字"
        type: "string"
      - name: "hero_service_link"
        label: "ファーストビュー サービス一覧リンク文字"
        type: "string"

      # --- 選ばれる理由（About Us） ---
      - name: "about_sec_title"
        label: "選ばれる理由 大見出し"
        type: "string"
      - name: "about_sec_lead"
        label: "選ばれる理由 案内文（リード文）"
        type: "text"
      - name: "about_01_tag"
        label: "About 01 英語タグ"
        type: "string"
      - name: "about_01_title"
        label: "About 01 見出し"
        type: "string"
      - name: "about_01_desc"
        label: "About 01 説明本文"
        type: "text"
      - name: "about_02_tag"
        label: "About 02 英語タグ"
        type: "string"
      - name: "about_02_title"
        label: "About 02 見出し"
        type: "string"
      - name: "about_02_desc"
        label: "About 02 説明本文"
        type: "text"
      - name: "about_03_tag"
        label: "About 03 英語タグ"
        type: "string"
      - name: "about_03_title"
        label: "About 03 見出し"
        type: "string"
      - name: "about_03_desc"
        label: "About 03 説明本文"
        type: "text"
      - name: "about_04_tag"
        label: "About 04 英語タグ"
        type: "string"
      - name: "about_04_title"
        label: "About 04 見出し"
        type: "string"
      - name: "about_04_desc"
        label: "About 04 説明本文"
        type: "text"
      - name: "about_04_btn"
        label: "About 04 社労士リンクボタン文字"
        type: "string"
      - name: "about_05_tag"
        label: "About 05 英語タグ"
        type: "string"
      - name: "about_05_title"
        label: "About 05 見出し"
        type: "string"
      - name: "about_05_desc"
        label: "About 05 説明本文"
        type: "text"

      # --- 提供サービス（SERVICES） ---
      - name: "services_sec_title"
        label: "提供サービス 大見出し"
        type: "string"
      - name: "services_sec_lead"
        label: "提供サービス 案内文（リード文）"
        type: "text"
      - name: "services_sec_btn"
        label: "全サービス詳細ボタン文字"
        type: "string"

      # --- ご相談の流れ（FLOW） ---
      - name: "flow_sec_title"
        label: "ご相談の流れ 大見出し"
        type: "string"
      - name: "flow_sec_lead"
        label: "ご相談の流れ 案内文（リード文）"
        type: "text"
      - name: "flow_01_title"
        label: "STEP 01 タイトル"
        type: "string"
      - name: "flow_01_desc"
        label: "STEP 01 説明文"
        type: "text"
      - name: "flow_02_title"
        label: "STEP 02 タイトル"
        type: "string"
      - name: "flow_02_desc"
        label: "STEP 02 説明文"
        type: "text"
      - name: "flow_03_title"
        label: "STEP 03 タイトル"
        type: "string"
      - name: "flow_03_desc"
        label: "STEP 03 説明文"
        type: "text"
      - name: "flow_04_title"
        label: "STEP 04 タイトル"
        type: "string"
      - name: "flow_04_desc"
        label: "STEP 04 説明文"
        type: "text"

      # --- 税理士紹介 ＆ 事務所概要 見出し ---
      - name: "team_sec_title"
        label: "税理士紹介 大見出し"
        type: "string"
      - name: "team_sec_lead"
        label: "税理士紹介 案内文（リード文）"
        type: "text"
      - name: "company_sec_title"
        label: "事務所概要 大見出し"
        type: "string"
      - name: "company_sec_lead"
        label: "事務所概要 案内文（リード文）"
        type: "text"

      # --- 下部無料相談バナー ---
      - name: "cta_banner_title"
        label: "下部バナー大見出し"
        type: "string"
      - name: "cta_banner_desc"
        label: "下部バナー説明文"
        type: "text"
      - name: "cta_banner_btn"
        label: "下部バナー予約ボタン文字"
        type: "string"

  # ============================================================================
  # 3. 事務所基本情報・連絡先・フッター設定
  # ============================================================================
  - name: "office_info_manager"
    label: "🏢 事務所情報・連絡先・フッターの管理"
    type: "file"
    path: "content/office_info.json"
    fields:
      - name: "office_name"
        label: "正式事務所名"
        type: "string"
      - name: "office_en"
        label: "英語表記ブランド名"
        type: "string"
      - name: "tel"
        label: "電話番号"
        type: "string"
      - name: "fax"
        label: "FAX番号"
        type: "string"
      - name: "address"
        label: "所在地住所"
        type: "string"
      - name: "postal_code"
        label: "郵便番号"
        type: "string"
      - name: "opening_hours"
        label: "営業時間"
        type: "string"
      - name: "areas"
        label: "対応エリア"
        type: "string"
      - name: "registration_info"
        label: "税理士登録情報"
        type: "string"
      - name: "alliance_desc"
        label: "提携士業の案内文（ザワテラス社労士）"
        type: "string"
      - name: "alliance_url"
        label: "提携士業公式URL"
        type: "string"
      - name: "copyright_year"
        label: "コピーライト表記"
        type: "string"

  # ============================================================================
  # 4. 税理士紹介・代表挨拶の全文章（profile.html）
  # ============================================================================
  - name: "profile_texts"
    label: "👤 税理士紹介・代表挨拶の編集"
    type: "file"
    path: "content/profile_texts.json"
    fields:
      - name: "page_title"
        label: "ページ大見出し"
        type: "string"
      - name: "page_lead"
        label: "ページ上部の導入リード文"
        type: "text"
      - name: "rep_keiko_name"
        label: "代表税理士 お名前"
        type: "string"
      - name: "rep_keiko_sub"
        label: "代表税理士 肩書き・専門"
        type: "string"
      - name: "rep_keiko_desc"
        label: "代表税理士 メッセージ本文（改行可）"
        type: "text"
      - name: "rep_keiko_careers"
        label: "代表税理士 主な経歴（改行で箇条書き）"
        type: "text"
      - name: "rep_senior_name"
        label: "ベテラン税理士 お名前"
        type: "string"
      - name: "rep_senior_sub"
        label: "ベテラン税理士 肩書き・専門"
        type: "string"
      - name: "rep_senior_desc"
        label: "ベテラン税理士 メッセージ本文（改行可）"
        type: "text"
      - name: "rep_senior_careers"
        label: "ベテラン税理士 主な経歴（改行で箇条書き）"
        type: "text"

  # ============================================================================
  # 5. 提供サービスの管理（services.html ＆ トップ連動）
  # ============================================================================
  - name: "services_manager"
    label: "🛠️ 提供サービスの管理"
    type: "file"
    path: "content/services.json"
    fields:
      - name: "page_title"
        label: "サービスページ大見出し"
        type: "string"
      - name: "page_lead"
        label: "サービスページ導入リード文"
        type: "text"
      - name: "service_items"
        label: "サービス一覧"
        type: "object"
        list:
          collapsible: true
          summary: "{service_no} {title}"
        fields:
          - name: "service_no"
            label: "番号"
            type: "string"
            required: true
          - name: "title"
            label: "サービス名"
            type: "string"
            required: true
          - name: "lead"
            label: "サービス説明文"
            type: "text"
            required: true
          - name: "points"
            label: "特徴・チェックポイント（改行で箇条書き）"
            type: "text"
            required: true

  # ============================================================================
  # 6. 料金案内・プランの管理（pricing.html）
  # ============================================================================
  - name: "pricing_manager"
    label: "💰 料金案内・プランの管理"
    type: "file"
    path: "content/pricing.json"
    fields:
      - name: "page_title"
        label: "料金ページ大見出し"
        type: "string"
      - name: "page_lead"
        label: "料金ページ導入リード文"
        type: "text"
      - name: "plans_sec_title"
        label: "顧問プラン見出し"
        type: "string"
      - name: "plans_sec_lead"
        label: "顧問プラン案内文"
        type: "string"
      - name: "plans"
        label: "法人税務顧問プラン一覧"
        type: "object"
        list:
          collapsible: true
          summary: "{name}"
        fields:
          - name: "name"
            label: "プラン名"
            type: "string"
            required: true
          - name: "badge"
            label: "おすすめバッジ"
            type: "string"
          - name: "target"
            label: "対象"
            type: "string"
          - name: "monthly_fee"
            label: "月額顧問料"
            type: "string"
            required: true
          - name: "settlement_fee"
            label: "決算申告料"
            type: "string"
            required: true
          - name: "features"
            label: "サポート内容（改行で箇条書き）"
            type: "text"
            required: true
      - name: "spot_sec_title"
        label: "スポット業務見出し"
        type: "string"
      - name: "spot_sec_lead"
        label: "スポット業務案内文"
        type: "string"
      - name: "spot_fees"
        label: "スポット業務料金表"
        type: "object"
        list:
          collapsible: true
          summary: "{service_name}"
        fields:
          - name: "service_name"
            label: "業務名"
            type: "string"
            required: true
          - name: "fee"
            label: "標準報酬（税込）"
            type: "string"
            required: true
          - name: "note"
            label: "備考"
            type: "string"

  # ============================================================================
  # 7. よくある質問（FAQ）の管理（faq.html）
  # ============================================================================
  - name: "faq_manager"
    label: "❓ よくある質問（FAQ）の管理"
    type: "file"
    path: "content/faq.json"
    fields:
      - name: "page_title"
        label: "FAQページ大見出し"
        type: "string"
      - name: "page_lead"
        label: "FAQページ導入リード文"
        type: "text"
      - name: "faq_list"
        label: "よくある質問一覧"
        type: "object"
        list:
          collapsible: true
          summary: "Q. {question}"
        fields:
          - name: "question"
            label: "質問（Q）"
            type: "string"
            required: true
          - name: "answer"
            label: "回答（A）"
            type: "text"
            required: true

  # ============================================================================
  # 8. お問い合わせ・規約の全文章（contact.html / privacy.html）
  # ============================================================================
  - name: "legal_texts"
    label: "✉️ お問い合わせ・規約の編集"
    type: "file"
    path: "content/legal_texts.json"
    fields:
      - name: "contact_lead"
        label: "お問い合わせページ 案内文"
        type: "text"
      - name: "contact_phone_note"
        label: "電話バナー上部テキスト"
        type: "string"
      - name: "contact_hours_note"
        label: "電話受付時間テキスト"
        type: "string"
      - name: "contact_notice"
        label: "機密情報注意喚起文"
        type: "text"
      - name: "contact_form_lead"
        label: "フォーム案内説明文"
        type: "text"
      - name: "privacy_sec1"
        label: "プライバシーポリシー 1. 基本方針および守秘義務"
        type: "text"
      - name: "privacy_sec2"
        label: "プライバシーポリシー 2. 個人情報の利用目的"
        type: "text"
      - name: "privacy_sec3"
        label: "プライバシーポリシー 3. 提携士業との共同利用"
        type: "text"
      - name: "privacy_sec4"
        label: "プライバシーポリシー 4. 免責事項"
        type: "text"

  # ============================================================================
  # 9. 税務・経営コラム（blog/ 直結）
  # ============================================================================
  - name: "blog"
    label: "📝 税務・経営コラム"
    type: "collection"
    path: "blog"
    fields:
      - name: "title"
        label: "記事タイトル"
        type: "string"
        required: true
      - name: "date"
        label: "公開日"
        type: "date"
        required: true
      - name: "category"
        label: "カテゴリー"
        type: "select"
        options:
          values:
            - "税務調査対策"
            - "法人税務・節税"
            - "会社設立・創業融資"
            - "クラウド会計・DX"
            - "相続税・事業承継"
            - "社労士連携・助成金"
      - name: "thumbnail"
        label: "サムネイル画像"
        type: "image"
      - name: "description"
        label: "記事要約"
        type: "string"
      - name: "body"
        label: "本文"
        type: "rich-text"
        required: true

  # ============================================================================
  # 10. 事務所からのお知らせ
  # ============================================================================
  - name: "news"
    label: "📢 事務所からのお知らせ"
    type: "collection"
    path: "content/news"
    fields:
      - name: "title"
        label: "お知らせタイトル"
        type: "string"
        required: true
      - name: "date"
        label: "告知日"
        type: "date"
        required: true
      - name: "body"
        label: "お知らせ本文"
        type: "rich-text"
        required: true
