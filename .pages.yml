# ==============================================================================
# 寺沢景子税理士事務所 Pages CMS 設定定義ファイル（全要素スマート非表示・増減完全版）
# ファイルパス: .pages.yml
# ==============================================================================

media:
  input: "assets/images/uploads"
  output: "assets/images/uploads"

content:
  # ============================================================================
  # 1. サイト全画像の変更（空欄なら非表示）
  # ============================================================================
  - name: "site_images"
    label: "📷 サイト全画像の変更"
    type: "file"
    path: "content/site_images.json"
    fields:
      - name: "logo_img"
        label: "ロゴ画像（ヘッダー・フッター共通）"
        type: "image"
      - name: "watermark_crest"
        label: "背景透かし画像（花冠・幾何学模様）"
        type: "image"
      - name: "hero_illustration"
        label: "ヒーロー象徴イラスト（白百合・花など）"
        type: "image"
      - name: "rep_keiko"
        label: "代表税理士 寺澤景子の写真"
        type: "image"
      - name: "rep_senior"
        label: "ベテラン税理士の写真"
        type: "image"
      - name: "about_01"
        label: 
        type: "image"
      - name: "about_02"
        label: 
        type: "image"
      - name: "about_03"
        label: "About 03（税理士歴35年実績）の写真"
        type: "image"
      - name: "about_04"
        label: "About 04（ザワテラス社労士連携）の写真"
        type: "image"
      - name: "about_05"
        label: "About 05（相談サロン風景）の写真"
        type: "image"
      - name: "service_01"
        label: "Service 01 法人税務顧問の写真"
        type: "image"
      - name: "service_02"
        label: "Service 02 税務調査対策の写真"
        type: "image"
      - name: "service_03"
        label: "Service 03 会社設立支援の写真"
        type: "image"
      - name: "service_04"
        label: "Service 04 創業融資支援の写真"
        type: "image"
      - name: "service_05"
        label: "Service 05 クラウド会計の写真"
        type: "image"
      - name: "service_06"
        label: "Service 06 相続税申告の写真"
        type: "image"
      - name: "service_07"
        label: "Service 07 助成金・労務支援の写真"
        type: "image"
      - name: "cta_banner_bg"
        label: "ページ下部 CTAバナー背景写真"
        type: "image"

  # ============================================================================
  # 2. トップページ全文章の編集（★空欄自動非表示 ＆ 項目自由増減）
  # ============================================================================
  - name: "home_texts"
    label: "🏠 トップページ全文章の編集"
    type: "file"
    path: "content/home_texts.json"
    fields:
      - name: "hero_sub_en"
        label: "ファーストビュー上部 英語サブタイトル（空欄で非表示）"
        type: "string"
      - name: "hero_title"
        label: "メインキャッチコピー（改行可・空欄で非表示）"
        type: "text"
      - name: "hero_lead"
        label: "ヒーロー説明文（改行可・空欄で非表示）"
        type: "text"

      # 月桂樹バッジリスト（追加・削除・並び替え）
      - name: "hero_badges"
        label: "月桂樹バッジ一覧（＋で追加、ゴミ箱で削除、全消去で非表示）"
        type: "object"
        list:
          collapsible: true
          summary: "{text}"
        fields:
          - name: "text"
            label: "バッジの文言"
            type: "string"

      - name: "hero_cta_btn"
        label: "ファーストビュー無料相談ボタンの文字（空欄でボタンごと非表示）"
        type: "string"
      - name: "hero_service_link"
        label: "サービス一覧リンク文字（空欄で非表示）"
        type: "string"

      # 選ばれる理由（About Us）
      - name: "about_sec_title"
        label: "選ばれる理由 大見出し（空欄で非表示）"
        type: "string"
      - name: "about_sec_lead"
        label: "選ばれる理由 案内文（空欄で非表示）"
        type: "text"

      # 選ばれる理由 リスト（＋で追加、ゴミ箱で削除可能！）
      - name: "about_items"
        label: "選ばれる理由 項目一覧（＋で追加、ゴミ箱で削除）"
        type: "object"
        list:
          collapsible: true
          summary: "{num} {title}"
        fields:
          - name: "num"
            label: "番号（例: 01）"
            type: "string"
          - name: "tag"
            label: "英語タグ（空欄でタグのみ非表示）"
            type: "string"
          - name: "title"
            label: "見出し"
            type: "string"
          - name: "desc"
            label: "説明本文"
            type: "text"
          - name: "btn_text"
            label: "リンクボタン文字（社労士リンク等 / 不要なら空欄でボタン非表示）"
            type: "string"
          - name: "btn_url"
            label: "リンク先URL（空欄なら非表示）"
            type: "string"

      # 提供サービス見出し
      - name: "services_sec_title"
        label: "提供サービス 大見出し（空欄で非表示）"
        type: "string"
      - name: "services_sec_lead"
        label: "提供サービス 案内文（空欄で非表示）"
        type: "text"
      - name: "services_sec_btn"
        label: "全サービス詳細ボタン文字（空欄でボタン非表示）"
        type: "string"

      # ご相談の流れ（FLOW）
      - name: "flow_sec_title"
        label: "ご相談の流れ 大見出し（空欄で非表示）"
        type: "string"
      - name: "flow_sec_lead"
        label: "ご相談の流れ 案内文（空欄で非表示）"
        type: "text"

      # 相談の流れ STEPリスト（＋で追加、ゴミ箱で削除可能！）
      - name: "flow_steps"
        label: "ご相談の流れ STEP一覧（＋で追加、ゴミ箱で削除）"
        type: "object"
        list:
          collapsible: true
          summary: "{step_label} {title}"
        fields:
          - name: "step_label"
            label: "STEP番号（例: STEP 01）"
            type: "string"
          - name: "title"
            label: "タイトル"
            type: "string"
          - name: "desc"
            label: "説明文"
            type: "text"

      # 税理士紹介＆概要 見出し
      - name: "team_sec_title"
        label: "税理士紹介 大見出し（空欄で非表示）"
        type: "string"
      - name: "team_sec_lead"
        label: "税理士紹介 案内文（空欄で非表示）"
        type: "text"
      - name: "company_sec_title"
        label: "事務所概要 大見出し（空欄で非表示）"
        type: "string"
      - name: "company_sec_lead"
        label: "事務所概要 案内文（空欄で非表示）"
        type: "text"

      # 下部無料相談バナー
      - name: "cta_banner_title"
        label: "下部バナー大見出し（空欄で非表示）"
        type: "string"
      - name: "cta_banner_desc"
        label: "下部バナー説明文（空欄で非表示）"
        type: "text"
      - name: "cta_banner_btn"
        label: "下部バナー予約ボタン文字（空欄でボタン非表示）"
        type: "string"

  # ============================================================================
  # 3. 事務所基本情報・連絡先・フッター設定
  # ============================================================================
  - name: "office_info_manager"
    label: "🏢 事務所情報・連絡先・フッターの管理"
    type: "file"
    path: "content/office_info.json"
    fields:
      - name: "office_name"
        label: "正式事務所名"
        type: "string"
      - name: "office_en"
        label: "英語表記ブランド名"
        type: "string"
      - name: "tel"
        label: "電話番号"
        type: "string"
      - name: "fax"
        label: "FAX番号（空欄なら表の行ごと非表示）"
        type: "string"
      - name: "address"
        label: "所在地住所"
        type: "string"
      - name: "postal_code"
        label: "郵便番号"
        type: "string"
      - name: "opening_hours"
        label: "営業時間"
        type: "string"
      - name: "areas"
        label: "対応エリア"
        type: "string"
      - name: "registration_info"
        label: "税理士登録情報"
        type: "string"
      - name: "alliance_desc"
        label: "提携士業の案内文（ザワテラス社労士 / 空欄で非表示）"
        type: "string"
      - name: "alliance_url"
        label: "提携士業公式URL"
        type: "string"
      - name: "copyright_year"
        label: "コピーライト表記"
        type: "string"

  # ============================================================================
  # 4. 税理士紹介・代表挨拶の全文章（profile.html）
  # ============================================================================
  - name: "profile_texts"
    label: "👤 税理士紹介・代表挨拶の編集"
    type: "file"
    path: "content/profile_texts.json"
    fields:
      - name: "page_title"
        label: "ページ大見出し"
        type: "string"
      - name: "page_lead"
        label: "ページ上部の導入リード文（空欄で非表示）"
        type: "text"
      - name: "rep_keiko_name"
        label: "代表税理士 お名前"
        type: "string"
      - name: "rep_keiko_sub"
        label: "代表税理士 肩書き・専門（空欄で非表示）"
        type: "string"
      - name: "rep_keiko_desc"
        label: "代表税理士 メッセージ本文"
        type: "text"
      - name: "rep_keiko_careers"
        label: "代表税理士 主な経歴（空欄で経歴枠ごと非表示）"
        type: "text"
      - name: "rep_senior_name"
        label: "ベテラン税理士 お名前"
        type: "string"
      - name: "rep_senior_sub"
        label: "ベテラン税理士 肩書き・専門（空欄で非表示）"
        type: "string"
      - name: "rep_senior_desc"
        label: "ベテラン税理士 メッセージ本文"
        type: "text"
      - name: "rep_senior_careers"
        label: "ベテラン税理士 主な経歴（空欄で経歴枠ごと非表示）"
        type: "text"

  # ============================================================================
  # 5. 提供サービスの管理（services.html ＆ トップ連動）
  # ============================================================================
  - name: "services_manager"
    label: "🛠️ 提供サービスの管理"
    type: "file"
    path: "content/services.json"
    fields:
      - name: "page_title"
        label: "サービスページ大見出し"
        type: "string"
      - name: "page_lead"
        label: "サービスページ導入リード文（空欄で非表示）"
        type: "text"
      - name: "service_items"
        label: "サービス一覧（＋で追加、ゴミ箱で削除）"
        type: "object"
        list:
          collapsible: true
          summary: "{service_no} {title}"
        fields:
          - name: "service_no"
            label: "番号"
            type: "string"
            required: true
          - name: "title"
            label: "サービス名"
            type: "string"
            required: true
          - name: "lead"
            label: "サービス説明文"
            type: "text"
            required: true
          - name: "points"
            label: "特徴・チェックポイント（空欄でリスト枠非表示）"
            type: "text"

  # ============================================================================
  # 6. 料金案内・プランの管理（pricing.html）
  # ============================================================================
  - name: "pricing_manager"
    label: "💰 料金案内・プランの管理"
    type: "file"
    path: "content/pricing.json"
    fields:
      - name: "page_title"
        label: "料金ページ大見出し"
        type: "string"
      - name: "page_lead"
        label: "料金ページ導入リード文（空欄で非表示）"
        type: "text"
      - name: "plans_sec_title"
        label: "顧問プラン見出し（空欄で非表示）"
        type: "string"
      - name: "plans_sec_lead"
        label: "顧問プラン案内文（空欄で非表示）"
        type: "string"
      - name: "plans"
        label: "法人税務顧問プラン一覧（＋で追加、ゴミ箱で削除）"
        type: "object"
        list:
          collapsible: true
          summary: "{name}"
        fields:
          - name: "name"
            label: "プラン名"
            type: "string"
            required: true
          - name: "badge"
            label: "おすすめバッジ（空欄でバッジ非表示）"
            type: "string"
          - name: "target"
            label: "対象"
            type: "string"
          - name: "monthly_fee"
            label: "月額顧問料"
            type: "string"
            required: true
          - name: "settlement_fee"
            label: "決算申告料"
            type: "string"
            required: true
          - name: "features"
            label: "サポート内容（空欄でリスト非表示）"
            type: "text"
      - name: "spot_sec_title"
        label: "スポット業務見出し（空欄で非表示）"
        type: "string"
      - name: "spot_sec_lead"
        label: "スポット業務案内文（空欄で非表示）"
        type: "string"
      - name: "spot_fees"
        label: "スポット業務料金表（＋で追加、ゴミ箱で削除）"
        type: "object"
        list:
          collapsible: true
          summary: "{service_name}"
        fields:
          - name: "service_name"
            label: "業務名"
            type: "string"
            required: true
          - name: "fee"
            label: "標準報酬（税込）"
            type: "string"
            required: true
          - name: "note"
            label: "備考（空欄可）"
            type: "string"

  # ============================================================================
  # 7. よくある質問（FAQ）の管理（faq.html）
  # ============================================================================
  - name: "faq_manager"
    label: "❓ よくある質問（FAQ）の管理"
    type: "file"
    path: "content/faq.json"
    fields:
      - name: "page_title"
        label: "FAQページ大見出し"
        type: "string"
      - name: "page_lead"
        label: "FAQページ導入リード文（空欄で非表示）"
        type: "text"
      - name: "faq_list"
        label: "よくある質問一覧（＋で追加、ゴミ箱で削除）"
        type: "object"
        list:
          collapsible: true
          summary: "Q. {question}"
        fields:
          - name: "question"
            label: "質問（Q）"
            type: "string"
            required: true
          - name: "answer"
            label: "回答（A）"
            type: "text"
            required: true

  # ============================================================================
  # 8. お問い合わせ・規約の全文章（contact.html / privacy.html）
  # ============================================================================
  - name: "legal_texts"
    label: "✉️ お問い合わせ・規約の編集"
    type: "file"
    path: "content/legal_texts.json"
    fields:
      - name: "contact_lead"
        label: "お問い合わせページ 案内文（空欄で非表示）"
        type: "text"
      - name: "contact_phone_note"
        label: "電話バナー上部テキスト"
        type: "string"
      - name: "contact_hours_note"
        label: "電話受付時間テキスト"
        type: "string"
      - name: "contact_notice"
        label: "機密情報注意喚起文（空欄で警告枠ごと非表示）"
        type: "text"
      - name: "contact_form_lead"
        label: "フォーム案内説明文"
        type: "text"
      - name: "privacy_sec1"
        label: "プライバシーポリシー 1. 基本方針および守秘義務"
        type: "text"
      - name: "privacy_sec2"
        label: "プライバシーポリシー 2. 個人情報の利用目的"
        type: "text"
      - name: "privacy_sec3"
        label: "プライバシーポリシー 3. 提携士業との共同利用（空欄で非表示）"
        type: "text"
      - name: "privacy_sec4"
        label: "プライバシーポリシー 4. 免責事項"
        type: "text"

  # ============================================================================
  # 9. 税務・経営コラム（blog/ 直結）
  # ============================================================================
  - name: "blog"
    label: "📝 税務・経営コラム"
    type: "collection"
    path: "blog"
    fields:
      - name: "title"
        label: "記事タイトル"
        type: "string"
        required: true
      - name: "date"
        label: "公開日"
        type: "date"
        required: true
      - name: "category"
        label: "カテゴリー"
        type: "select"
        options:
          values:
            - "税務調査対策"
            - "法人税務・節税"
            - "会社設立・創業融資"
            - "クラウド会計・DX"
            - "相続税・事業承継"
            - "社労士連携・助成金"
      - name: "thumbnail"
        label: "サムネイル画像"
        type: "image"
      - name: "description"
        label: "記事要約"
        type: "string"
      - name: "body"
        label: "本文"
        type: "rich-text"
        required: true

  # ============================================================================
  # 10. 事務所からのお知らせ
  # ============================================================================
  - name: "news"
    label: "📢 事務所からのお知らせ"
    type: "collection"
    path: "content/news"
    fields:
      - name: "title"
        label: "お知らせタイトル"
        type: "string"
        required: true
      - name: "date"
        label: "告知日"
        type: "date"
        required: true
      - name: "body"
        label: "お知らせ本文"
        type: "rich-text"
        required: true
