          primary: title
          fields:
            - title
            - date
            - category
          sort: date
          order: desc
        fields:
          - name: title
            label: タイトル
            type: string
            required: true
          - name: date
            label: 公開日
            type: date
          - name: category
            label: カテゴリー
            type: string
          - name: description
            label: 要約文
            type: text
          - name: thumbnail
            label: サムネイル画像
            type: image
          - name: body
            label: 本文
