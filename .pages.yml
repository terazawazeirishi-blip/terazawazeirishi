# ==============================================================================
# 寺沢景子税理士事務所 Pages CMS 設定定義ファイル（全コンテンツ管理対応完全版）
# ファイルパス: .pages.yml
# 仕様: API-Key-Free / HTML直接編集ゼロ / Zero-Fail
# ==============================================================================

media:
  input: "assets/images/uploads"
  output: "assets/images/uploads"

content:
  # ============================================================================
  # 1. サイト全画像の変更（一括管理）
  # ============================================================================
  - name: "site_images"
    label: "📷 サイト全画像の変更"
    type: "file"
    path: "content/site_images.json"
    fields:
      - name: "logo_img"
        label: "ロゴ画像（ヘッダー・フッター共通）"
        type: "image"
      - name: "watermark_crest"
        label: "背景透かし画像（花冠・幾何学模様）"
        type: "image"
      - name: "hero_illustration"
        label: "ヒーロー象徴イラスト（白百合・花など）"
        type: "image"
      - name: "rep_keiko"
        label: "代表税理士 寺沢景子の写真"
        type: "image"
      - name: "rep_senior"
        label: "ベテラン税理士の写真"
        type: "image"
      - name: "about_01"
        label: "About 01（2人体制ダブルチェック）の写真"
        type: "image"
      - name: "about_02"
        label: "About 02（国税21年元統括官）の写真"
        type: "image"
      - name: "about_03"
        label: "About 03（税理士歴35年実績）の写真"
        type: "image"
      - name: "about_04"
        label: "About 04（ザワテラス社労士連携）の写真"
        type: "image"
      - name: "about_05"
        label: "About 05（相談サロン風景）の写真"
        type: "image"
      - name: "service_01"
        label: "Service 01 法人税務顧問の写真"
        type: "image"
      - name: "service_02"
        label: "Service 02 税務調査対策の写真"
        type: "image"
      - name: "service_03"
        label: "Service 03 会社設立支援の写真"
        type: "image"
      - name: "service_04"
        label: "Service 04 創業融資支援の写真"
        type: "image"
      - name: "service_05"
        label: "Service 05 クラウド会計の写真"
        type: "image"
      - name: "service_06"
        label: "Service 06 相続税申告の写真"
        type: "image"
      - name: "service_07"
        label: "Service 07 助成金・労務支援の写真"
        type: "image"
      - name: "cta_banner_bg"
        label: "ページ下部 CTAバナー背景写真"
        type: "image"

  # ============================================================================
  # 2. ★【新設】よくある質問（FAQ）の追加・編集・削除
  # ============================================================================
  - name: "faq_manager"
    label: "❓ よくある質問（FAQ）の管理"
    type: "file"
    path: "content/faq.json"
    fields:
      - name: "faq_list"
        label: "Q&Aリスト（＋で追加、ゴミ箱で削除、並び替え可能）"
        type: "list"
        fields:
          - name: "question"
            label: "質問（Q）"
            type: "string"
            required: true
          - name: "answer"
            label: "回答（A）"
            type: "text"
            required: true

  # ============================================================================
  # 3. ★【新設】料金案内・プランの編集
  # ============================================================================
  - name: "pricing_manager"
    label: "💰 料金案内・プランの管理"
    type: "file"
    path: "content/pricing.json"
    fields:
      - name: "plans"
        label: "法人税務顧問プラン一覧"
        type: "list"
        fields:
          - name: "name"
            label: "プラン名"
            type: "string"
            required: true
          - name: "badge"
            label: "おすすめバッジ（例: 一番選ばれています / 空欄可）"
            type: "string"
          - name: "target"
            label: "対象（例: 年商5,000万円〜2億円未満の法人様）"
            type: "string"
          - name: "monthly_fee"
            label: "月額顧問料（例: 38,500）"
            type: "string"
            required: true
          - name: "settlement_fee"
            label: "決算料（例: 198,000）"
            type: "string"
            required: true
          - name: "features"
            label: "サポート内容（改行で箇条書き）"
            type: "text"
            required: true
      - name: "spot_fees"
        label: "スポット業務料金表"
        type: "list"
        fields:
          - name: "service_name"
            label: "業務名"
            type: "string"
            required: true
          - name: "fee"
            label: "標準報酬（税込）"
            type: "string"
            required: true
          - name: "note"
            label: "備考"
            type: "string"

  # ============================================================================
  # 4. ★【新設】提供サービス詳細の編集
  # ============================================================================
  - name: "services_manager"
    label: "🛠️ 提供サービスの管理"
    type: "file"
    path: "content/services.json"
    fields:
      - name: "service_items"
        label: "サービス一覧"
        type: "list"
        fields:
          - name: "service_no"
            label: "番号（例: SERVICE 01）"
            type: "string"
            required: true
          - name: "title"
            label: "サービス名"
            type: "string"
            required: true
          - name: "lead"
            label: "サービス説明文"
            type: "text"
            required: true
          - name: "points"
            label: "特徴・チェックポイント（改行で箇条書き）"
            type: "text"
            required: true

  # ============================================================================
  # 5. 税務・経営コラム（blog/ 直結）
  # ============================================================================
  - name: "blog"
    label: "📝 税務・経営コラム"
    type: "collection"
    path: "blog"
    fields:
      - name: "title"
        label: "記事タイトル"
        type: "string"
        required: true
      - name: "date"
        label: "公開日"
        type: "date"
        required: true
      - name: "category"
        label: "カテゴリー"
        type: "select"
        options:
          values:
            - "税務調査対策"
            - "法人税務・節税"
            - "会社設立・創業融資"
            - "クラウド会計・DX"
            - "相続税・事業承継"
            - "社労士連携・助成金"
      - name: "thumbnail"
        label: "サムネイル画像"
        type: "image"
      - name: "description"
        label: "記事要約"
        type: "string"
      - name: "body"
        label: "本文"
        type: "rich-text"
        required: true

  # ============================================================================
  # 6. 事務所からのお知らせ
  # ============================================================================
  - name: "news"
    label: "📢 事務所からのお知らせ"
    type: "collection"
    path: "content/news"
    fields:
      - name: "title"
        label: "お知らせタイトル"
        type: "string"
        required: true
      - name: "date"
        label: "告知日"
        type: "date"
        required: true
      - name: "body"
        label: "お知らせ本文"
        type: "rich-text"
        required: true
