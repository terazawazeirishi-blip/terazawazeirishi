# Pages CMS configuration for 寺澤景子税理士事務所
# Existing public HTML and JSON files are preserved. This file only defines the CMS editor.

media:
  input: assets/images/uploads
  output: /assets/images/uploads
  rename: false
  categories:
    - image

content:
  - name: homepage
    label: トップページ
    type: group
    items:
      - name: home-texts
        label: トップページ文章（公開ページ連動）
        type: file
        path: content/home_texts.json
        format: json
        fields:
          - name: hero_badge
            label: メイン画像上の案内文
            type: string
          - name: hero_catch_main
            label: メインキャッチコピー
            type: string
          - name: hero_catch_sub
            label: メイン説明文
            type: text
          - name: hero_cta_label
            label: メイン相談ボタンの文字
            type: string
          - name: hero_cta_url
            label: メイン相談ボタンのリンク先
            type: string
          - name: services_cta_label
            label: サービス一覧ボタンの文字
            type: string
          - name: services_cta_url
            label: サービス一覧ボタンのリンク先
            type: string
          - name: features_title
            label: 選ばれる理由の見出し
            type: string
          - name: features_subtitle
            label: 選ばれる理由の導入文
            type: string
          - name: feature_01_title
            label: 選ばれる理由 1 見出し
            type: string
          - name: feature_01_text
            label: 選ばれる理由 1 説明
            type: text
          - name: feature_02_title
            label: 選ばれる理由 2 見出し
            type: string
          - name: feature_02_text
            label: 選ばれる理由 2 説明
            type: text
          - name: feature_03_title
            label: 選ばれる理由 3 見出し
            type: string
          - name: feature_03_text
            label: 選ばれる理由 3 説明
            type: text
          - name: feature_04_title
            label: 選ばれる理由 4 見出し
            type: string
          - name: feature_04_text
            label: 選ばれる理由 4 説明
            type: text
          - name: feature_05_title
            label: 選ばれる理由 5 見出し
            type: string
          - name: feature_05_text
            label: 選ばれる理由 5 説明
            type: text

      - name: home-blocks
        label: トップページのセクション表示設定
        type: file
        path: content/pages/home_blocks.json
        format: json
        fields:
          - name: blocks
            label: ページ内ブロック
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{id} ({index})"
            fields:
              - name: id
                label: 管理ID
                type: string
                readonly: true
              - name: type
                label: ブロック種類
                type: string
                readonly: true
              - name: visible
                label: 表示する
                type: boolean

      - name: site-images
        label: ホームページ画像
        type: file
        path: content/site_images.json
        format: json
        fields:
