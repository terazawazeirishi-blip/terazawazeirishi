/**
 * TERAZAWA WEBSITE STUDIO - Public Rendering & CMS Sync Engine
 * Module: assets/js/main.js
 * Version: 4.0.0 (Safe Restored Edition: Zero Display-None & Guaranteed 260px Photo)
 */
(function () {
  'use strict';

  // blog/ 階層判定（サブディレクトリ対応）
  const isBlog = window.location.pathname.indexOf('/blog/') !== -1;
  const basePath = isBlog ? '../' : './';

  function resolveUrl(path) {
    if (!path || typeof path !== 'string') return '';
    let c = path.trim().replace(/^(\.\/|\/)+/, '').replace(/^terazawazeirishi\//, '');
    if (!c.includes('/') && !c.startsWith('data:')) c = 'assets/images/uploads/' + c;
    return basePath + c + '?t=' + Date.now();
  }

  // 安全に写真枠の中へ画像を挿入（サイズ固定・枠消去は一切行わない）
  function setPhotoSafe(searchText, imgUrl, maxW, isSquare) {
    if (!imgUrl) return;
    const all = document.querySelectorAll('div, p, span');
    for (let i = 0; i < all.length; i++) {
      const el = all[i];
      if (el.textContent.includes(searchText) && el.querySelectorAll('div').length === 0) {
        const frame = el.closest('div') || el;
        frame.textContent = ''; // プレースホルダーの文字のみ消去
        const img = document.createElement('img');
        img.src = imgUrl;
        img.alt = '写真';
        img.style.cssText = 'width:100%;max-width:' + maxW + 'px;' + (isSquare ? 'height:' + maxW + 'px;' : 'height:auto;aspect-ratio:4/3;') + 'object-fit:cover;border-radius:8px;display:block;margin:0 auto;box-shadow:0 4px 16px rgba(27,42,74,0.08);';
        frame.appendChild(img);
        break;
      }
    }
  }

  async function syncImages() {
    try {
      const res = await fetch(basePath + 'content/site_images.json?v=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();

      // 1. 代表税理士（寺澤景子）: 260px正方形枠に確実に挿入（枠消去なし）
      if (data.rep_keiko) {
        setPhotoSafe('Keiko Terazawa', resolveUrl(data.rep_keiko), 260, true);
      }

      // 2. 副代表（田河定茂）: 260px正方形枠に確実に挿入（枠消去なし）
      if (data.rep_senior) {
        setPhotoSafe('Senior Tax Advisor', resolveUrl(data.rep_senior), 260, true);
      }

      // 3. 選ばれる理由01〜05（文字枠の中に確実に挿入、枠消去なし）
      if (data.about_01) setPhotoSafe('2人体制写真', resolveUrl(data.about_01), 500, false);
      if (data.about_02) setPhotoSafe('調査防衛枠', resolveUrl(data.about_02), 500, false);
      if (data.about_03) setPhotoSafe('実務枠', resolveUrl(data.about_03), 500, false);
      if (data.about_04) setPhotoSafe('社労士連携枠', resolveUrl(data.about_04), 500, false);
      if (data.about_05) setPhotoSafe('花のあるサロン枠', resolveUrl(data.about_05), 500, false);

      // 4. ロゴ
      if (data.logo_img) {
        document.querySelectorAll('.site-logo img').forEach(function (img) {
          img.src = resolveUrl(data.logo_img);
        });
      }

      // 5. ヒーロー象徴アート
      if (data.hero_illustration) {
        document.querySelectorAll('.hero-bg-artwork-wrap img, .athena-hero-art img').forEach(function (img) {
          img.src = resolveUrl(data.hero_illustration);
        });
      }

    } catch (e) {
      console.warn('[TERAZAWA] Image sync error:', e);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', syncImages);
  } else {
    syncImages();
  }
})();
