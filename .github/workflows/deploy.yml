name: TERAZAWA Website Studio Auto Deploy Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Deterministic Blog Builder
        run: |
          if [ -f scripts/build_blog.py ]; then
            python scripts/build_blog.py
          fi

      - name: Run Static SEO & JSON-LD Synchronizer
        run: |
          if [ -f scripts/build_seo.py ]; then
            python scripts/build_seo.py
          fi

      - name: Commit Generated HTML and SEO Updates (Auto-Sync)
        run: |
          git config user.name "TERAZAWA Auto-Sync Bot"
          git config user.email "bot@terazawa-tax.local"
          git add -A
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto-sync): update blog HTML and SEO metadata [skip ci]"
            git push origin main
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-sync
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
