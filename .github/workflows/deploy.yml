# ==============================================================================
# TERAZAWA WEBSITE STUDIO - CI/CD & Automated Quality Guard Pipeline
# Version: 3.4.0 (Zero-Fail / Deterministic Validator & Auto-Deploy Edition)
# ==============================================================================

name: TERAZAWA Quality Guard & Pages Deploy Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # ジョブ1: 静的生成・品質検査・自動コミット
  # ----------------------------------------------------------------------------
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 1. Run Deterministic Blog Builder
        run: |
          if [ -f scripts/build_blog.py ]; then
            python scripts/build_blog.py
          fi

      - name: 2. Run Static SEO & JSON-LD Synchronizer
        run: |
          if [ -f scripts/build_seo.py ]; then
            python scripts/build_seo.py
          fi

      # ★最重要: 品質ゲート（エラー検知時はここでビルド停止し公開をブロック）
      - name: 3. Run Deterministic Quality & Security Validator
        run: |
          python scripts/deterministic_validator.py

      - name: 4. Commit and Push Generated Artifacts (Auto-Sync)
        run: |
          git config user.name "TERAZAWA Quality Bot"
          git config user.email "bot@terazawa-tax.local"
          git add -A
          if git diff-index --quiet HEAD; then
            echo "No changes to commit. Working tree clean."
          else
            git commit -m "chore(auto-sync): update blog, SEO metadata, and verified assets [skip ci]"
            git push origin main
          fi

      - name: 5. Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  # ----------------------------------------------------------------------------
  # ジョブ2: GitHub Pages への本番安全デプロイ（検査合格時のみ実行）
  # ----------------------------------------------------------------------------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
